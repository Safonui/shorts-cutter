name: Сборка .exe для Windows

# Зачем этот файл
# ───────────────
# Собирает «Нарезку Shorts» на чистой виртуальной машине GitHub (windows-latest),
# где нет ни Smart App Control, ни повреждённого хранилища компонентов Windows.
# Собираются два варианта:
#
#   1. «Портативный .exe»     — один файл ~50 МБ, без распознавания речи;
#   2. «.exe с субтитрами»    — папка ~600 МБ + zip, с faster-whisper.
#
# Когда что собирается:
#   • push в main/master          → только портативный .exe;
#   • ручной запуск (Run workflow)→ что отметите галочкой;
#   • push тега вида v1.0.0       → ОБА варианта, и оба прикладываются к релизу.
#
# Каждый вариант проверяется запуском самого собранного файла:
#   --check            — программа стартует и находит вшитый ffmpeg;
#   --check-subtitles  — импортируются ctranslate2/onnxruntime/av, загружается
#                        модель и реально идёт распознавание (только для сборки
#                        с субтитрами). Если это падает — сборка не считается
#                        удачной, и релиз не выйдет.

on:
  workflow_dispatch:
    inputs:
      with_subtitles:
        description: 'Собрать вариант с распознаванием речи (~600 МБ вместо ~50 МБ)'
        type: boolean
        default: false

  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: write        # нужно, чтобы приложить файлы к релизу по тегу

env:
  # Русский текст в отчётах .exe и в подписях Python не должен падать
  # на консоли Windows с её кодировкой по умолчанию.
  PYTHONIOENCODING: utf-8

jobs:
  # ── 1. Тесты: если они падают, .exe не собираем ───────────────────────────
  tests:
    name: Тесты и самопроверка
    runs-on: windows-latest
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Юнит-тесты (python main.py --selftest)
        run: python main.py --selftest

      # smoke_ui.py открывает настоящее окно Tk: на виртуальной машине это
      # обычно работает, но сбой этой проверки не должен отменять сборку.
      - name: Проверка окна (необязательная)
        continue-on-error: true
        run: python tests/smoke_ui.py

  # ── 2. Портативный .exe без субтитров ─────────────────────────────────────
  build-light:
    name: Портативный .exe (без субтитров)
    if: ${{ !inputs.with_subtitles }}
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установить зависимости для сборки
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Собрать .exe
        run: python build_exe.py

      - name: Проверить, что .exe запускается и субтитры в него не попали
        shell: python
        run: |
          import glob, pathlib, subprocess, sys, time

          exes = glob.glob("dist/**/Нарезка Shorts.exe", recursive=True)
          if len(exes) != 1:
              sys.exit("ожидался один .exe, найдено: %s" % exes)
          exe = exes[0]
          log = pathlib.Path(exe).parent / "shorts_cutter.log"
          if log.exists():
              log.unlink()

          started = time.time()
          result = subprocess.run([exe, "--check"], capture_output=True, text=True,
                                  encoding="utf-8", errors="replace", timeout=900)
          report = log.read_text(encoding="utf-8", errors="replace") if log.exists() else ""
          print("=== %s --check: код %s за %.1f с" % (exe, result.returncode,
                                                      time.time() - started))
          print(report.strip() or "(журнал пуст)")
          print("размер: %.1f МБ" % (pathlib.Path(exe).stat().st_size / 1e6))

          problems = []
          if result.returncode != 0:
              problems.append("--check вернул код %s" % result.returncode)
          if "ffmpeg:" not in report:
              problems.append("в отчёте нет строки про ffmpeg")
          if "недоступны" not in report:
              problems.append("субтитры не исключены из лёгкой сборки")
          if problems:
              print("\nПРОБЛЕМЫ: " + "; ".join(problems))
              sys.exit(1)
          print("\nЛёгкая сборка проверена: запускается, ffmpeg внутри, субтитры исключены")

      - name: Выложить .exe в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: narezka-shorts-exe-no-subtitles
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0        # .exe внутри уже сжат
          retention-days: 30

  # ── 3. Сборка с распознаванием речи ───────────────────────────────────────
  build-subtitles:
    name: .exe с субтитрами (папка + zip)
    if: ${{ inputs.with_subtitles || startsWith(github.ref, 'refs/tags/v') }}
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Забрать код
        uses: actions/checkout@v4

      - name: Поставить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Установить зависимости для сборки
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller faster-whisper

      # Папка, а не один файл: под 600 МБ распаковка во временную папку при
      # каждом запуске была бы слишком долгой.
      - name: Собрать папку с .exe
        run: python build_exe.py --with-subtitles --onedir

      # Главная проверка: субтитры должны работать ВНУТРИ собранного .exe —
      # модель загрузится и распознает короткий звук, сделанный вшитым ffmpeg.
      - name: Проверить распознавание речи внутри сборки
        shell: python
        run: |
          import glob, pathlib, subprocess, sys, time

          exes = glob.glob("dist/**/Нарезка Shorts.exe", recursive=True)
          if len(exes) != 1:
              sys.exit("ожидался один .exe, найдено: %s" % exes)
          exe = exes[0]
          folder = pathlib.Path(exe).parent
          log = folder / "shorts_cutter.log"

          def run(flag, timeout):
              if log.exists():
                  log.unlink()
              started = time.time()
              result = subprocess.run([exe, flag], capture_output=True, text=True,
                                      encoding="utf-8", errors="replace", timeout=timeout)
              report = log.read_text(encoding="utf-8", errors="replace") if log.exists() else ""
              print("\n=== %s %s: код %s за %.1f с" % (exe, flag, result.returncode,
                                                        time.time() - started))
              print(report.strip() or "(журнал пуст)")
              if result.stderr.strip():
                  print("stderr:", result.stderr.strip()[:1500])
              return result.returncode, report

          problems = []
          code, report = run("--check", 900)
          if code != 0:
              problems.append("--check вернул код %s" % code)
          if "ffmpeg:" not in report:
              problems.append("в отчёте нет строки про ffmpeg")
          if "недоступны" in report or "доступны" not in report:
              problems.append("модуль распознавания не попал в сборку")

          code, report = run("--check-subtitles", 2400)
          if code != 0:
              problems.append("--check-subtitles вернул код %s" % code)
          if "ОШИБКА" in report:
              problems.append("в отчёте распознавания есть ошибка")
          if "распознано:" not in report:
              problems.append("распознавание не дошло до конца")

          total = sum(item.stat().st_size for item in folder.rglob("*") if item.is_file())
          print("\nразмер папки: %.0f МБ" % (total / 1e6))
          if problems:
              print("ПРОБЛЕМЫ: " + "; ".join(problems))
              sys.exit(1)
          print("Сборка с субтитрами проверена: распознавание речи работает внутри .exe")

      - name: Упаковать папку в zip
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = "$PWD\dist\Нарезка-Shorts-с-субтитрами.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            "$PWD\dist\Нарезка Shorts", $zip,
            [System.IO.Compression.CompressionLevel]::Fastest, $true)
          Get-Item $zip | Format-List Name, @{n='МБ';e={[math]::Round($_.Length/1MB,1)}}

      - name: Выложить сборку в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: narezka-shorts-exe-with-subtitles
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0        # zip уже собран
          retention-days: 30

  # ── 4. Релиз: только при push тега вида v1.0.0 ────────────────────────────
  release:
    name: Релиз по тегу
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-light, build-subtitles]
    runs-on: ubuntu-latest
    steps:
      - name: Забрать собранные файлы
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Показать, что скачали
        run: find artifacts -type f -exec ls -lh {} \;

      - name: Приложить файлы к релизу
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Имена содержат пробелы и кириллицу («Нарезка Shorts.exe»), поэтому
          # читаем список в массив: без кавычек bash разбил бы имя на аргументы.
          mapfile -t FILES < <(find artifacts -type f \( -name '*.exe' -o -name '*.zip' \) -print)
          if [ ${#FILES[@]} -eq 0 ]; then
            echo "Собранных файлов не найдено — сначала должна пройти сборка."
            exit 1
          fi
          printf 'к релизу: %s\n' "${FILES[@]}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${FILES[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${FILES[@]}" \
              --title "Нарезка Shorts $GITHUB_REF_NAME" \
              --generate-notes
          fi

      - name: Ссылка на релиз
        run: echo "${{ github.server_url }}/${{ github.repository }}/releases/tag/$GITHUB_REF_NAME"
